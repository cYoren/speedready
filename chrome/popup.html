<!doctype html>
<html>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<script src="popup.js" type="module"></script>

<header>
  <img src="icons/48.png" alt="" width="28" height="28">
  <b>Speedready</b>
</header>

<section class="today" aria-live="polite">
  <div class="row"><span data-i18n="readToday"></span><b id="today"></b></div>
  <div class="bar"><div id="fill"></div></div>
  <div class="row"><span data-i18n="streak"></span><b id="streak"></b></div>
</section>

<section class="controls" aria-label="Reading settings">
  <div class="seg" role="group" aria-label="Mode">
    <button type="button" id="mode-pacer" class="seg-btn">Pacer</button>
    <button type="button" id="mode-rsvp" class="seg-btn">RSVP</button>
  </div>
  <div class="wpm-step">
    <button type="button" id="wpm-down" aria-label="Slower">−</button>
    <b id="wpm-val">280 WPM</b>
    <button type="button" id="wpm-up" aria-label="Faster">+</button>
  </div>
</section>

<button id="read" class="primary" type="button"><span data-i18n="readPage"></span><small id="read-meta"></small></button>
<button id="library" type="button" data-i18n="openLibrary"></button>
<p class="hint"><span id="shortcut"></span><span data-i18n="selectionTip"></span></p>

<footer>
  <a id="phone" href="https://speedready.vercel.app/?utm_source=chrome&amp;utm_medium=popup" target="_blank" rel="noopener" data-i18n="phoneApp"></a>
  <a id="datalyst" href="https://www.datalyst.one/?utm_source=speedready-chrome&amp;utm_medium=popup" target="_blank" rel="noopener" data-i18n="datalyst"></a>
</footer>
</html>
