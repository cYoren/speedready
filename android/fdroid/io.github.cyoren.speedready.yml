Builds:
  - versionName: 1.0.7
    versionCode: 7
    commit: 04bdfc12eebae7ad3ce970682dc5183aa242a3dc
    subdir: android/app
    gradle:
      - yes
    # fdroidserver's scanner flags every .gz as a possible prebuilt blob. This one is plain
    # JSON compressed by tools/build_genders.py, and the desktop app, the web reader and the
    # APK assets all need it, so scandelete would break the build and scanignore is correct.
    # Keep this field inside the build entry: the fdroiddata schema rejects it at app level,
    # and fdroid rewritemeta strips comments, so the live copy in fdroiddata carries none.
    scanignore:
      - web/genders-de.json.gz

