<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232327"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#1f8f57"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="111" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
  <!-- text lines -->
  <g stroke="#6b6b72" stroke-width="26" stroke-linecap="round">
    <line x1="96" y1="150" x2="330" y2="150"/>
    <line x1="96" y1="362" x2="290" y2="362"/>
    <line x1="96" y1="256" x2="150" y2="256"/>
    <line x1="352" y1="256" x2="416" y2="256"/>
  </g>
  <!-- the word being read -->
  <rect x="176" y="222" width="152" height="68" rx="20" fill="url(#hl)"/>
  <!-- pivot guides -->
  <g stroke="#ff5252" stroke-width="12" stroke-linecap="round">
    <line x1="252" y1="186" x2="252" y2="206"/>
    <line x1="252" y1="306" x2="252" y2="326"/>
  </g>
</svg>
