AutoName: Speedready
Summary: Read in another language, with a translation above every word you do not know

Description: |-
    Speedready is a reader for people learning a language. It carries you through a book at
    a pace you set, so you keep reading instead of stopping at every unfamiliar word, and it
    puts the translation right where your eyes already are.

    Above every word you have not marked as known yet sits its translation in your own
    language. Tap that translation and the word is marked as learned: it disappears from the
    whole book, and the text gets cleaner as your vocabulary grows.

    While you read:

    * A highlight sweeps through the text at your pace, or flashes one word at a time
    * Tap a word for its translation, to hear it, or to start reading from there
    * Hold a word you are still learning: it is underlined everywhere and the pace slows for it
    * Sentences can be read aloud by the voice already on your device, with the text following
    * Bookmark a spot, jump between chapters, and pick up where you left off in every book

    The dictionary and a public-domain German storybook ship inside the app. There is no
    account and no network access, and the app requests no permissions at all. Everything you
    look up can be exported as an Anki deck. You can open any EPUB or text file of your own.

    The reader is the same code that runs as a desktop application on Linux.

