apply plugin: 'com.android.application'

// Reproducible builds: F-Droid rebuilds this source and checks it matches the APK published on
// GitHub, then ships that one. Their builder has no keystore.properties, so it produces an
// unsigned APK from exactly the same inputs - the signature is the only difference, which is
// what their verification strips. Never commit keystore.properties or the .keystore itself.
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

android {
    namespace 'io.github.cyoren.speedready'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.cyoren.speedready'
        minSdk 26                 // WebView with DecompressionStream and modern JS
        targetSdk 35
        versionCode 7
        versionName '1.0.7'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 shrinking is on at F-Droid's request (fdroiddata MR !49884). It does not
            // break reproducible builds: the same source and toolchain still produce the
            // same bytes. shrinkResources stays off, because the reader is loaded from
            // assets at runtime and the resource shrinker cannot see it.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreFile.exists() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The reader itself lives in ../../web and is copied in as assets, so the app and the
    // website are literally the same code.
    sourceSets.main.assets.srcDirs += ["${rootDir}/../web"]

    dependenciesInfo {          // F-Droid rejects the Play dependency blob
        includeInApk false
        includeInBundle false
    }
}

dependencies { }
